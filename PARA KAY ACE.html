<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💙 Ciana's Love Quiz 💙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8e6cf 0%, #b8d8e8 25%, #dcedf2 50%, #e8f4f8 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Hearts & Sparkles */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart, .sparkle {
            position: absolute;
            font-size: 20px;
            animation: float 6s infinite linear;
        }

        .heart { color: #ff69b4; }
        .sparkle { color: #ffd700; }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Screens */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .cute-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0, 150, 200, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 4px solid #a8e6cf;
            animation: bounceIn 1s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 2.2em;
            color: #4a90e2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 1.8em;
            color: #ff6b9d;
            margin-bottom: 25px;
        }

        .clue {
            font-size: 1.2em;
            color: #ff6b9d;
            margin-bottom: 30px;
            font-weight: bold;
        }

        input[type="password"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid #a8e6cf;
            border-radius: 25px;
            font-size: 1.2em;
            text-align: center;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
            transform: scale(1.02);
        }

        .btn {
            background: linear-gradient(45deg, #ff6b9d, #4a90e2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
            font-family: inherit;
            margin: 10px;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 107, 157, 0.5);
        }

        .btn:active { transform: translateY(-1px) scale(1.02); }

        .yes-btn { background: linear-gradient(45deg, #ff9a9e, #fecfef); }
        .no-btn { background: linear-gradient(45deg, #a8e6cf, #b8d8e8); }
        .quiz-btn { background: linear-gradient(45deg, #ffd93d, #ffeb3b); color: #333; }

        /* Quiz Options */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .quiz-options button {
            padding: 12px;
            font-size: 1em;
            border-radius: 20px;
            background: linear-gradient(45deg, #e8f4f8, #dcedf2);
            color: #4a90e2;
            border: 2px solid #a8e6cf;
        }

        .quiz-options button:hover {
            background: linear-gradient(45deg, #ff6b9d, #ff9a9e);
            color: white;
            transform: scale(1.05);
        }

        /* Feedback */
        .feedback {
            font-size: 1.4em;
            padding: 15px;
            border-radius: 20px;
            margin: 20px 0;
            animation: slideIn 0.5s ease;
        }

        .correct { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .wrong { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; animation: shake 0.5s; }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .popup-content {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            transform: scale(0.7);
            animation: popupBounce 0.6s ease forwards;
            border: 4px solid #ff6b9d;
        }

        @keyframes popupBounce {
            0% { transform: scale(0.7); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-emoji { font-size: 4.5em; margin-bottom: 20px; }
        .popup-text { font-size: 1.8em; color: #4a90e2; margin-bottom: 15px; font-weight: bold; }

        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #4a90e2);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            h1 { font-size: 1.8em; }
            h2 { font-size: 1.5em; }
            .cute-card { padding: 30px 20px; }
            .popup-content { padding: 30px 20px; }
            .quiz-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Floating Elements -->
    <div class="floating-hearts" id="hearts"></div>

    <!-- Password Screen -->
    <div class="screen" id="passwordScreen">
        <div class="cute-card">
            <h1>💙 Stitch Secret 💙</h1>
            <div class="clue">Clue: It's the word you always reply sa akin kapag wala ka nang masabi 💙</div>
            <input type="password" id="passwordInput" placeholder="Enter password..." maxlength="10">
            <button class="btn" onclick="checkPassword()">Unlock Love 🥰</button>
            <div class="feedback wrong hidden" id="errorText">Try again, baby 🥺</div>
        </div>
    </div>

    <!-- Main Screen -->
    <div class="screen hidden" id="mainScreen">
        <div class="cute-card">
            <h1>💙 Do you love Ciana? 💙</h1>
            <button class="btn yes-btn" onclick="showYesPopup()">Yes 😍</button>
            <button class="btn no-btn" onclick="showNoPopup()">No 😢</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div class="screen hidden" id="quizScreen">
        <div class="cute-card">
            <h1>💙 Ciana Quiz Time! 💙</h1>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <h2 id="quizQuestion"></h2>
            <div id="quizOptions"></div>
            <div id="quizFeedback" class="feedback hidden"></div>
        </div>
    </div>

    <!-- Final Screen -->
    <div class="screen hidden" id="finalScreen">
        <div class="cute-card">
            <h1>🎉 Perfect Score! 🎉</h1>
            <div style="font-size: 1.6em; color: #ff6b9d; margin: 30px 0;">
                You know me so well, baby 💙<br>I love you so much! 🥰
            </div>
            <div style="font-size: 3em; margin: 20px 0;">💖✨💙</div>
            <button class="btn" onclick="restart()">Play Again 💕</button>
        </div>
    </div>

    <!-- Popups -->
    <div class="popup hidden" id="yesPopup">
        <div class="popup-content">
            <div class="popup-emoji">😍💖✨</div>
            <div class="popup-text">I love you more 💙</div>
            <button class="btn" onclick="startQuiz()">Prove it! Quiz Time 🥰</button>
        </div>
    </div>

    <div class="popup hidden" id="noPopup">
        <div class="popup-content">
            <div class="popup-emoji">🥺😭💔</div>
            <div class="popup-text">Aww baby, why? 🥺😭</div>
            <button class="btn" onclick="closePopup()">Try again? 💙</button>
        </div>
    </div>

    <script>
        // Quiz Data - EASY TO EDIT!
        const quizData = [
            {
                question: "How many letters are there in Ciana's first name?",
                type: "number",
                answer: 5,
                input: true
            },
            {
                question: "Guess Ciana's favorite color",
                options: ["Blue", "Pink", "Purple", "Green"],
                answer: "Blue"
            },
            {
                question: "Guess Ciana's favorite line",
                options: ["Lala", "Sige", "O sige", "Hala"],
                answer: "Lala"
            },
            {
                question: "Guess Ciana's favorite character",
                options: ["Stitch", "Elsa", "Moana", "Ariel"],
                answer: "Stitch"
            },
            {
                question: "Guess Ciana's favorite Disney movie",
                options: ["Moana", "Tangled", "Frozen", "The Little Mermaid", "Beauty and the Beast"],
                answer: "Frozen"
            },
            {
                question: "Guess Ciana's 2nd favorite color",
                options: ["Pink", "Purple", "Yellow", "Green", "Red"],
                answer: "Yellow"
            },
            {
                question: "Guess Ciana's shoe size",
                options: ["35", "36", "37", "38", "39"],
                answer: "37"
            },
            {
                question: "Guess the instrument Ciana loves to play",
                options: ["Guitar", "Piano", "Violin", "Drums", "Ukulele"],
                answer: "Piano"
            },
            {
                question: "Guess Ciana's birthday",
                type: "date",
                answer: "2002-11-25" // EDIT THIS EASILY! Format: YYYY-MM-DD
            }
        ];

        let currentQuiz = 0;
        let score = 0;

        // Floating elements
        function createFloatingElements() {
            const heartsContainer = document.getElementById('hearts');
            const elements = ['💖', '💕', '💗', '💙', '✨', '⭐', '🌟', '🥰'];
            setInterval(() => {
                const element = document.createElement('div');
                element.innerHTML = elements[Math.floor(Math.random() * elements.length)];
                element.className = 'heart sparkle';
                element.style.left = Math.random() * 100 + '%';
                element.style.animationDuration = (Math.random() * 3 + 4) + 's';
                element.style.animationDelay = Math.random() * 2 + 's';
                heartsContainer.appendChild(element);
                setTimeout(() => element.remove(), 7000);
            }, 400);
        }

        // Password
        function checkPassword() {
            const password = document.getElementById('passwordInput').value.trim().toLowerCase();
            const errorText = document.getElementById('errorText');
            
            if (password === 'lala') {
                document.getElementById('passwordScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
            } else {
                errorText.classList.remove('hidden');
                document.getElementById('passwordInput').classList.add('shake');
                setTimeout(() => {
                    errorText.classList.add('hidden');
                    document.getElementById('passwordInput').classList.remove('shake');
                }, 1500);
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // Popups
        function showYesPopup() { document.getElementById('yesPopup').classList.remove('hidden'); }
        function showNoPopup() { document.getElementById('noPopup').classList.remove('hidden'); }
        function closePopup() {
            document.getElementById('yesPopup').classList.add('hidden');
            document.getElementById('noPopup').classList.add('hidden');
        }

        function startQuiz() {
            closePopup();
            currentQuiz = 0;
            score = 0;
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            showQuizQuestion();
        }

        function showQuizQuestion() {
            if (currentQuiz >= quizData.length) {
                showFinalScreen();
                return;
            }

            const quiz = quizData[currentQuiz];
            document.getElementById('quizQuestion').textContent = quiz.question;
            const optionsDiv = document.getElementById('quizOptions');
            const feedback = document.getElementById('quizFeedback');
            
            optionsDiv.innerHTML = '';
            feedback.classList.add('hidden');

            const progress = ((currentQuiz / quizData.length) * 100);
            document.getElementById('progressBar').style.width = progress + '%';

            if (quiz.input) {
                optionsDiv.innerHTML = `
                    <input type="${quiz.type}" id="quizAnswer" placeholder="Type your answer..." 
                           style="max-width: 250px; margin: 0 auto; display: block;">
                    <button class="btn" onclick="checkQuizAnswer()">Submit Answer 💙</button>
                `;
                document.getElementById('quizAnswer').focus();
            } else {
                quiz.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn';
                    btn.textContent = option;
                    btn.onclick = () => checkQuizAnswer(option);
                    optionsDiv.appendChild(btn);
                });
            }
        }

        function checkQuizAnswer(selectedAnswer = null) {
            const quiz = quizData[currentQuiz];
            let userAnswer;
            
            if (quiz.input) {
                userAnswer = document.getElementById('quizAnswer').value.trim();
                if (quiz.type === 'number') userAnswer = parseInt(userAnswer);
            } else {
                userAnswer = selectedAnswer;
            }

            const feedback = document.getElementById('quizFeedback');
            const isCorrect = quiz.input 
                ? userAnswer == quiz.answer 
                : userAnswer.toLowerCase() === quiz.answer.toLowerCase();

            if (isCorrect) {
                score++;
                feedback.textContent = "Correct, baby! 💙";
                feedback.className = "feedback correct";
            } else {
                feedback.textContent = `Aww try again 🥺 (Correct: ${quiz.answer})`;
                feedback.className = "feedback wrong";
            }

            feedback.classList.remove('hidden');
            
            if (isCorrect) {
                setTimeout(() => {
                    currentQuiz++;
                    showQuizQuestion();
                }, 1500);
            }
        }

        function showFinalScreen() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('finalScreen').classList.remove('hidden');
        }

        function restart() {
            document.getElementById('finalScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
        }

        // Initialize
        createFloatingElements();
    </script>
</body>
</html>
